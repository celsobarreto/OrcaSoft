<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>OrçaSoftware</title>
<style>
:root{--navy:#102a43;--ink:#1c3149;--muted:#718096;--line:#e4eaf0;--bg:#f4f7fa;--teal:#11998e;--pale:#e7f6f3;--white:#fff;--shadow:0 8px 25px #0f29420b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:245px;background:var(--navy);color:#dbe6ef;display:flex;flex-direction:column;padding:23px 14px}.logo{display:flex;gap:11px;align-items:center;padding:2px 9px 28px;color:white;font-size:18px;font-weight:800}.logo i{font-style:normal;background:#20b2a6;color:#07333b;width:35px;height:35px;border-radius:11px;display:grid;place-items:center}.logo small{display:block;font-size:10px;color:#9cb1c5;letter-spacing:1px;font-weight:600}.navtitle{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#91a8be;padding:14px 10px 6px;font-weight:800}.nav{display:grid;gap:5px}.nav button{border:0;border-radius:9px;background:transparent;color:#c8d5e1;text-align:left;padding:10px 12px;font-weight:650}.nav button:hover,.nav button.on{background:#ffffff19;color:#fff}.nav button span{display:inline-block;width:27px;font-size:17px}.sidefoot{margin-top:auto;border-top:1px solid #ffffff24;padding:15px 10px 0;color:#99aec2;font-size:12px}.main{min-width:0;flex:1}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:3}.crumb{font-size:13px;color:var(--muted)}.profile{display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--pale);color:#087d74;display:grid;place-items:center;font-weight:800}.profile b{display:block;font-size:13px}.profile small{display:block;color:var(--muted)}.wrap{max-width:1260px;padding:28px 32px 54px;margin:auto}.head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin:0 0 23px}.head h1{font-size:27px;line-height:1.2;letter-spacing:-.7px;margin:0;color:#102a43}.head p{margin:6px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:white;color:var(--ink);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:#a7bdce;background:#fafcfd}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:hover{background:#0b8279}.btn.small{padding:6px 9px;font-size:12px}.btn.danger{color:#ad3b38}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.icon{width:32px;height:32px;border-radius:9px;background:#edf3fb;color:#416dc4;display:grid;place-items:center;font-size:16px}.stat-value{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:9px}.muted{color:var(--muted)}.tiny{font-size:12px}.cols{grid-template-columns:1.55fr .9fr}.card h2{font-size:16px;margin:0 0 14px}.tablewrap{background:white;border:1px solid var(--line);border-radius:11px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:640px}.table th,.table td{text-align:left;padding:12px 14px;border-bottom:1px solid #edf1f4;font-size:13px}.table th{background:#f8fafb;color:#687f94;font-size:10px;text-transform:uppercase;letter-spacing:.7px}.table tr:last-child td{border:0}.sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}.badge{border-radius:20px;padding:4px 8px;background:#edf2f6;font-weight:750;font-size:10px;color:#52687d;white-space:nowrap}.badge.green{background:#e4f5eb;color:#187248}.badge.blue{background:#e9f0ff;color:#3459a9}.badge.gold{background:#fff3d9;color:#8b650c}.badge.red{background:#fdeae8;color:#a93431}.empty{text-align:center;padding:35px 16px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.quick{display:grid;gap:8px}.quick .btn{justify-content:flex-start;padding:11px}.activity{display:grid;gap:12px}.activity div{border-left:2px solid #81c9bb;padding-left:11px;font-size:12px}.activity small{color:var(--muted)}.searchrow{display:flex;gap:9px;margin-bottom:13px}.searchrow input{flex:1}.input,select,textarea{border:1px solid #d6e0e8;border-radius:8px;background:#fff;padding:9px 10px;width:100%;color:var(--ink);outline:0}.input:focus,select:focus,textarea:focus{border-color:#49a99f;box-shadow:0 0 0 3px #11998e1b}textarea{min-height:88px;resize:vertical}.label{display:block;color:#4d6277;font-size:12px;font-weight:700;margin-bottom:5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{margin-bottom:12px}.wide{grid-column:1/-1}.modalbg{position:fixed;inset:0;z-index:9;background:#0b1d2ccc;display:grid;place-items:center;padding:16px}.modal{width:min(780px,100%);max-height:95vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 22px 70px #071a2b55}.mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start;position:sticky;top:0;background:white;z-index:2}.mhead h2{margin:0;font-size:19px}.mhead p{margin:3px 0;color:var(--muted);font-size:12px}.mbody{padding:19px 22px}.mfoot{padding:13px 22px;border-top:1px solid var(--line);background:#fbfcfd;display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:0}.steps{display:flex;gap:8px;margin-bottom:18px}.step{flex:1;border-top:3px solid #dce5ec;padding-top:6px;color:#8899a8;font-size:11px;font-weight:700}.step.active{border-color:var(--teal);color:#087e74}.step.done{border-color:#82c8b8;color:#087e74}.note{padding:11px 13px;border-radius:9px;border:1px solid #e2eaf1;background:#f3f7fa;color:#4d657a;font-size:12px;margin-bottom:14px}.note.warn{background:#fff7e5;border-color:#efdfb8;color:#7b5c1b}.list{display:grid;gap:7px}.line{display:grid;grid-template-columns:1fr 35px;gap:6px}.task{display:grid;grid-template-columns:1.6fr 110px 95px 35px;gap:7px;margin-bottom:7px}.task input,.task select{min-width:0}.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scenario{border:1px solid var(--line);border-radius:10px;padding:13px}.scenario.active{border:2px solid var(--teal);background:#f3fbf9}.scenario h3{font-size:14px;margin:0}.price{font-size:21px;font-weight:850;margin:8px 0}.formula{background:#eef8f6;padding:12px;border-radius:8px;margin-top:12px;font-size:12px;display:flex;justify-content:space-between;gap:10px}.formula strong{font-size:18px;color:#087e74}.check{display:flex;gap:9px;padding:11px;border:1px solid var(--line);border-radius:9px;margin-top:14px;font-size:12px}.check input{accent-color:var(--teal);margin-top:3px}.toast{position:fixed;z-index:30;right:20px;bottom:20px;background:#14344e;color:white;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow)}.toast.err{background:#a43a36}.doc{max-width:760px;margin:0 auto;padding:34px;background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:9px}.doc h1{font-size:24px}.doc h2{font-size:15px;margin:22px 0 7px}.doc p,.doc li{font-size:12px;line-height:1.65;color:#43596e}.doc table{width:100%;border-collapse:collapse;font-size:12px}.doc th,.doc td{text-align:left;padding:7px;border-bottom:1px solid var(--line)}.dochead{border-bottom:3px solid var(--teal);padding-bottom:13px}.hint{border-top:1px solid var(--line);padding-top:12px;margin-top:20px;font-size:11px;color:#718096}.hamb{display:none;border:0;background:none;font-size:22px}.overlay{display:none}@media(max-width:950px){.side{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.wrap{padding:23px}}@media(max-width:680px){.side{position:fixed;z-index:11;top:0;bottom:0;left:-260px;width:250px;transition:left .2s}.side.open{left:0}.overlay.open{display:block;position:fixed;inset:0;background:#091c2d88;z-index:10}.hamb{display:inline-block;margin-right:9px}.top{height:58px;padding:0 13px}.wrap{padding:20px 14px 40px}.head h1{font-size:23px}.head p{font-size:12px}.stats{gap:9px}.card{padding:14px}.stat-value{font-size:23px}.profile>div:last-child{display:none}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.scenarios{grid-template-columns:1fr}.task{grid-template-columns:1fr 80px 75px 32px}.mhead,.mbody{padding-left:15px;padding-right:15px}.mfoot{padding:11px 15px}.doc{padding:21px}.head .btn{font-size:12px;padding:8px}.steps{gap:4px}.step{font-size:10px}}@media print{body{background:white}.side,.top,.head,.noprint{display:none!important}.wrap{padding:0;max-width:none}.doc{border:0;box-shadow:none;padding:8mm 12mm}.doc h2{break-after:avoid}.doc table{break-inside:avoid}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="logo"><i>O</i><span>OrçaSoftware<small>PROPOSTAS DE SOFTWARE</small></span></div><div class="navtitle">Workspace</div><nav class="nav"><button data-page="home" class="on"><span>▦</span>Visão geral</button><button data-page="clients"><span>♙</span>Clientes</button><button data-page="projects"><span>◫</span>Projetos</button><button data-page="budgets"><span>▤</span>Orçamentos</button><button data-page="models"><span>▱</span>Modelos</button></nav><div class="navtitle">Preferências</div><nav class="nav"><button data-page="settings"><span>⚙</span>Configurações</button></nav><div class="sidefoot">Modo local · dados salvos neste navegador</div></aside><div class="overlay" id="overlay"></div><main class="main"><header class="top"><div style="display:flex;align-items:center"><button class="hamb" id="hamb">☰</button><div class="crumb">Workspace / <b id="crumb">Visão geral</b></div></div><div class="profile"><div class="avatar" id="avatar">M</div><div><b id="profileName">Meu espaço</b><small id="profileRole">Freelancer</small></div></div></header><div class="wrap" id="view"></div></main></div><div id="modal"></div><div id="toast"></div>
<script>
(()=>{'use strict';const STORE='orca.v1',SET='orca.sb';const fresh=()=>({profile:{name:'Meu espaço',role:'Freelancer',brand:'',email:'',phone:'',rate:100,margin:15,contingency:10,payment:'30% na aprovação e saldo por etapas',validity:15},clients:[],projects:[],activity:[],models:{'Site institucional':['Análise e levantamento','UX/UI','Desenvolvimento de interface','Desenvolvimento de back-end','Testes e correções','Implantação'],'Sistema web':['Análise e levantamento','UX/UI','Arquitetura e planejamento técnico','Desenvolvimento de interface','Desenvolvimento de back-end','Banco de dados e integrações','Testes e correções','Implantação','Treinamento e documentação'],'Dashboard':['Análise e levantamento','UX/UI','Desenvolvimento de interface','Integrações e dados','Testes e implantação']}});let db=read(),page='home',query='',wiz=null,step=0;function read(){try{return {...fresh(),...JSON.parse(localStorage.getItem(STORE)||'{}'),profile:{...fresh().profile,...(JSON.parse(localStorage.getItem(STORE)||'{}').profile||{})}}}catch{return fresh()}}function save(){localStorage.setItem(STORE,JSON.stringify(db));paintProfile();if(typeof cloudPush==='function'&&sbcfg().token)cloudPush().catch(e=>toast('Falha na sincronização Supabase: '+e.message,true))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return Math.random().toString(36).slice(2,10)}function brl(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0)}function dt(x){return x?new Intl.DateTimeFormat('pt-BR').format(new Date(x)):'—'}function toast(s,err=false){let t=document.getElementById('toast');t.textContent=s;t.className='toast'+(err?' err':'');setTimeout(()=>t.className='',2600)}function paintProfile(){let p=db.profile;document.getElementById('profileName').textContent=p.brand||p.name;document.getElementById('profileRole').textContent=p.role;document.getElementById('avatar').textContent=(p.name||'M').trim()[0].toUpperCase()}function log(s){db.activity.unshift({text:s,date:new Date().toISOString()});db.activity=db.activity.slice(0,20);save()}function client(id){return db.clients.find(c=>c.id===id)?.name||'—'}function value(p){return Number(p?.scenarios?.[p?.chosen||'Intermediário']?.total)||0}function badge(s){let c={'Aprovada':'green','Enviada':'blue','Pronta para envio':'blue','Em negociação':'gold','Em revisão':'gold','Recusada':'red','Expirada':'red'}[s]||'';return `<span class="badge ${c}">${esc(s||'Rascunho')}</span>`}const pageNames={home:'Visão geral',clients:'Clientes',projects:'Projetos',budgets:'Orçamentos',models:'Modelos',settings:'Configurações'};function go(p){page=p;document.getElementById('crumb').textContent=pageNames[p];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===p));document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('open');render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('hamb').onclick=()=>{document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('open')};document.getElementById('overlay').onclick=()=>{document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('open')};function render(){let v=document.getElementById('view'),shared=readSharedProposal();if(shared){document.getElementById('side').style.display='none';document.querySelector('.top').style.display='none';v.innerHTML=sharedPage(shared);return}document.getElementById('side').style.display='';document.querySelector('.top').style.display='';v.innerHTML=page==='home'?home():page==='clients'?clientsPage():page==='projects'?projectsPage():page==='budgets'?budgetsPage():page==='models'?modelsPage():settingsPage();bind();paintProfile()}function home(){let ps=db.projects,total=ps.reduce((n,p)=>n+value(p),0),draft=ps.filter(p=>['Rascunho','Em revisão'].includes(p.status)).length,sent=ps.filter(p=>['Enviada','Em negociação'].includes(p.status)).length,approved=ps.filter(p=>p.status==='Aprovada').length;return `<div class="head"><div><h1>Visão geral</h1><p>Acompanhe seus projetos, estimativas e propostas.</p></div><button class="btn primary" data-action="new">＋ Novo orçamento</button></div><div class="grid stats">${[['Projetos cadastrados',ps.length,'◫'],['Em elaboração',draft,'✎'],['Propostas em andamento',sent,'↗'],['Valor estimado total',brl(total),'R$']].map(a=>`<div class="card"><div class="stat-label">${a[0]}<span class="icon">${a[2]}</span></div><div class="stat-value">${a[1]}</div><div class="tiny muted">${a[0]==='Valor estimado total'?`${approved} aprovada(s)`:'No seu espaço'}</div></div>`).join('')}</div><div class="grid cols"><div class="card"><h2>Orçamentos recentes</h2>${ps.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Projeto</th><th>Cliente</th><th>Status</th><th>Valor</th><th></th></tr></thead><tbody>${ps.slice().sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,6).map(p=>`<tr><td><b>${esc(p.name)}</b><span class="sub">${esc(p.type)}</span></td><td>${esc(client(p.clientId))}</td><td>${badge(p.status)}</td><td>${brl(value(p))}</td><td><button class="btn small" data-action="proposal" data-id="${p.id}">Ver</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>Seu espaço está pronto</strong>Cadastre um cliente e crie seu primeiro orçamento.<br><button class="btn primary small" data-action="new" style="margin-top:12px">Começar orçamento</button></div>`}</div><div class="grid"><div class="card"><h2>Acesso rápido</h2><div class="quick"><button class="btn" data-action="new">＋ Criar orçamento</button><button class="btn" data-action="new-client">♙ Cadastrar cliente</button><button class="btn" data-action="nav-budget">▤ Acompanhar propostas</button></div></div><div class="card"><h2>Atividade recente</h2>${db.activity.length?`<div class="activity">${db.activity.slice(0,5).map(a=>`<div>${esc(a.text)}<br><small>${dt(a.date)}</small></div>`).join('')}</div>`:`<div class="tiny muted">As ações recentes aparecerão aqui.</div>`}</div></div></div><p class="hint">Valores e prazos são estimativas configuráveis; valide o escopo, as premissas e os riscos antes de enviar uma proposta.</p>`}function clientsPage(){let xs=db.clients.filter(c=>(c.name+' '+c.contact+' '+c.email).toLowerCase().includes(query.toLowerCase()));return `<div class="head"><div><h1>Clientes</h1><p>Cadastre e organize seus contatos.</p></div><button class="btn primary" data-action="new-client">＋ Novo cliente</button></div><div class="searchrow"><input class="input" id="search" value="${esc(query)}" placeholder="Buscar cliente"></div>${xs.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Cliente</th><th>Contato</th><th>E-mail</th><th>Telefone</th><th>Projetos</th><th>Ações</th></tr></thead><tbody>${xs.map(c=>`<tr><td><b>${esc(c.name)}</b><span class="sub">${esc(c.company||'')}</span></td><td>${esc(c.contact||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.phone||'—')}</td><td>${db.projects.filter(p=>p.clientId===c.id).length}</td><td><button class="btn small" data-action="edit-client" data-id="${c.id}">Editar</button> <button class="btn small danger" data-action="del-client" data-id="${c.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty"><strong>${query?'Nenhum resultado':'Nenhum cliente cadastrado'}</strong>${query?'Tente outro termo.':'Cadastre um cliente para associar ao orçamento.'}</div>`}`}function projectsPage(){let xs=db.projects.filter(p=>(p.name+' '+client(p.clientId)).toLowerCase().includes(query.toLowerCase()));return `<div class="head"><div><h1>Projetos</h1><p>Briefings, escopos e estimativas.</p></div><button class="btn primary" data-action="new">＋ Novo orçamento</button></div><div class="searchrow"><input id="search" class="input" placeholder="Buscar projeto ou cliente" value="${esc(query)}"></div>${xs.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Projeto</th><th>Cliente</th><th>Tipo</th><th>Status</th><th>Atualizado</th><th></th></tr></thead><tbody>${xs.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(client(p.clientId))}</td><td>${esc(p.type)}</td><td>${badge(p.status)}</td><td>${dt(p.updated)}</td><td><button class="btn small" data-action="edit-project" data-id="${p.id}">Abrir</button> <button class="btn small danger" data-action="del-project" data-id="${p.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty"><strong>Nenhum projeto encontrado</strong>Inicie pelo briefing para criar um orçamento.</div>`}`}function budgetsPage(){let xs=db.projects.filter(p=>(p.name+' '+client(p.clientId)).toLowerCase().includes(query.toLowerCase()));return `<div class="head"><div><h1>Orçamentos</h1><p>Gere propostas e acompanhe o andamento.</p></div><button class="btn primary" data-action="new">＋ Novo orçamento</button></div><div class="searchrow"><input id="search" class="input" placeholder="Buscar orçamento" value="${esc(query)}"></div>${xs.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Projeto</th><th>Cliente</th><th>Status</th><th>Cenário</th><th>Estimativa</th><th></th></tr></thead><tbody>${xs.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(client(p.clientId))}</td><td><select class="status" data-id="${p.id}">${['Rascunho','Em revisão','Pronta para envio','Enviada','Em negociação','Aprovada','Recusada','Expirada'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${esc(p.chosen||'Intermediário')}</td><td>${brl(value(p))}</td><td><button class="btn small" data-action="proposal" data-id="${p.id}">Proposta</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty"><strong>Nenhum orçamento</strong>Quando criar um projeto, ele aparecerá aqui.</div>`}`}function modelsPage(){return `<div class="head"><div><h1>Modelos de etapas</h1><p>Personalize as etapas sugeridas para estimar seus projetos.</p></div><button class="btn primary" data-action="add-model">＋ Novo modelo</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${Object.entries(db.models).map(([name,stages])=>`<div class="card"><h2>${esc(name)}</h2><ul class="tiny muted">${stages.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><button class="btn small" data-action="edit-model" data-id="${esc(name)}">Editar</button></div>`).join('')}</div>`}function settingsPage(){let p=db.profile,cfg=JSON.parse(localStorage.getItem(SET)||'{}');return `<div class="head"><div><h1>Configurações</h1><p>Dados do proponente e parâmetros padrão.</p></div><button class="btn primary" data-action="save-settings">Salvar</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h2>Perfil profissional</h2><div class="note">Defina seu perfil como aluno, freelancer ou empresa. O cliente recebe um link de visualização da proposta, sem precisar criar conta; a opção de imprimir ou salvar em PDF continua disponível.</div>${input('Nome','name',p.name)}<div class="field"><label class="label">Perfil</label><select name="role">${['Aluno','Freelancer','Empresa'].map(x=>`<option ${p.role===x?'selected':''}>${x}</option>`).join('')}</select></div>${input('Empresa ou marca','brand',p.brand)}${input('E-mail','email',p.email,'email')}${input('Telefone','phone',p.phone)}</div><div class="card"><h2>Parâmetros padrão</h2>${input('Taxa por hora (R$)','rate',p.rate,'number')}${input('Margem (%)','margin',p.margin,'number')}${input('Contingência (%)','contingency',p.contingency,'number')}${input('Condição de pagamento','payment',p.payment)}${input('Validade da proposta (dias)','validity',p.validity,'number')}</div><div class="card" style="grid-column:1/-1"><h2>Persistência com Supabase (opcional)</h2><div class="note warn">Por padrão, os dados ficam somente neste navegador. Para usar contas e sincronização online, informe um projeto Supabase, habilite Auth e crie a tabela com RLS. Use a chave anon/public, nunca a service_role.</div>${input('URL Supabase','sburl',cfg.url||'')}${input('Chave anon/public','sbkey',cfg.key||'')}<div class="quick" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))"><button class="btn" data-action="sb-config">Salvar conexão</button><button class="btn" data-action="sb-auth">Entrar / criar conta</button><button class="btn" data-action="sb-sync">Sincronizar agora</button></div><p class="tiny muted">${cfg.token?'Conectado: '+esc(cfg.email):'Sem conta Supabase conectada.'}</p><details><summary class="tiny" style="cursor:pointer;font-weight:700">SQL da tabela e política de acesso</summary><pre style="white-space:pre-wrap;background:#f4f7fa;padding:12px;border-radius:8px;font-size:11px">create table if not exists public.orca_user_data (user_id uuid primary key references auth.users(id) on delete cascade, data jsonb not null default '{}'::jsonb, updated_at timestamptz not null default now());
alter table public.orca_user_data enable row level security;
create policy "own data" on public.orca_user_data for all using (auth.uid()=user_id) with check (auth.uid()=user_id);</pre></details></div><div class="card" style="grid-column:1/-1"><h2>Backup dos dados locais</h2><div class="quick" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><button class="btn" data-action="export">Baixar backup JSON</button><label class="btn" for="file">Importar backup JSON</label><input id="file" type="file" accept="application/json" hidden><button class="btn danger" data-action="clear">Apagar dados locais</button></div></div></div>`}function input(label,name,val,type='text'){return `<div class="field"><label class="label">${label}</label><input class="input" name="${name}" type="${type}" value="${esc(val??'')}"></div>`}
function modal(html){document.getElementById('modal').innerHTML=`<div class="modalbg" id="mbg"><section class="modal">${html}</section></div>`;document.getElementById('mbg').onclick=e=>{if(e.target.id==='mbg')close()};document.onkeydown=e=>{if(e.key==='Escape')close()}}function close(){document.getElementById('modal').innerHTML='';document.onkeydown=null}function clientForm(c={}){modal(`<div class="mhead"><div><h2>${c.id?'Editar cliente':'Cadastrar cliente'}</h2><p>Campos com * são obrigatórios.</p></div><button class="btn small" data-action="close">×</button></div><form id="clientform"><div class="mbody"><div class="formgrid"><div class="field wide"><label class="label">Nome ou razão social *</label><input class="input" name="name" required value="${esc(c.name||'')}"></div><div class="field"><label class="label">Pessoa de contato</label><input class="input" name="contact" value="${esc(c.contact||'')}"></div><div class="field"><label class="label">Empresa</label><input class="input" name="company" value="${esc(c.company||'')}"></div><div class="field"><label class="label">E-mail</label><input class="input" name="email" type="email" value="${esc(c.email||'')}"></div><div class="field"><label class="label">Telefone</label><input class="input" name="phone" value="${esc(c.phone||'')}"></div><div class="field wide"><label class="label">Observações</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div></div><div class="mfoot"><button type="button" class="btn" data-action="close">Cancelar</button><button class="btn primary">Salvar cliente</button></div></form>`);document.querySelectorAll('[data-action=close]').forEach(b=>b.onclick=close);document.getElementById('clientform').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(c.id)Object.assign(c,x);else db.clients.unshift({id:id(),...x});save();log(`${c.id?'Cliente atualizado':'Cliente cadastrado'}: ${x.name}`);close();render();toast('Cliente salvo.')}}
function newProject(p){if(!db.clients.length){toast('Cadastre um cliente antes de iniciar.',true);clientForm();return}wiz=p?structuredClone(p):{id:id(),name:'',clientId:'',type:'Sistema web',problem:'',users:'',platforms:'Web',features:'',integrations:'',requirements:'',deadline:'',constraints:'',scope:{included:[],excluded:[],assumptions:[],risks:[],dependencies:[]},tasks:[],chosen:'Intermediário',status:'Rascunho',rate:db.profile.rate,margin:db.profile.margin,contingency:db.profile.contingency,cost:0,discount:0,weeks:0,validity:db.profile.validity,payment:db.profile.payment};step=0;wizard()}
const steps=['Briefing','Escopo','Estimativa','Revisão'];function wizard(){let html=step===0?brief():step===1?scopeForm():step===2?estimate():review();modal(`<div class="mhead"><div><h2>${esc(wiz.name||'Novo orçamento')}</h2><p>Etapa ${step+1} de 4 · ${steps[step]}</p></div><button class="btn small" data-action="close">×</button></div><div class="mbody"><div class="steps">${steps.map((s,i)=>`<div class="step ${i===step?'active':i<step?'done':''}">${i+1}. ${s}</div>`).join('')}</div>${html}</div><div class="mfoot"><button class="btn" data-action="back" ${step===0?'disabled':''}>Voltar</button><div style="display:flex;gap:7px"><button class="btn" data-action="draft">Salvar rascunho</button><button class="btn primary" data-action="next">${step===3?'Confirmar revisão':'Continuar'}</button></div></div>`);bindWizard()}
function brief(){return `<div class="note">Descreva a necessidade do cliente. As sugestões não substituem validação de requisitos, estimativa técnica ou revisão profissional.</div><div class="formgrid"><div class="field"><label class="label">Cliente *</label><select name="clientId" required><option value="">Selecione</option>${db.clients.map(c=>`<option value="${c.id}" ${wiz.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label class="label">Nome do projeto *</label><input class="input" name="name" required value="${esc(wiz.name)}" placeholder="Ex.: Sistema de agendamento"></div><div class="field"><label class="label">Tipo de solução</label><select name="type">${['Site institucional','Sistema web','Aplicativo','E-commerce','Dashboard','API','Automação','Outro'].map(x=>`<option ${wiz.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label">Prazo desejado pelo cliente</label><input class="input" name="deadline" value="${esc(wiz.deadline)}" placeholder="Não é compromisso"></div><div class="field wide"><label class="label">Problema ou objetivo *</label><textarea name="problem" required>${esc(wiz.problem)}</textarea></div><div class="field"><label class="label">Público usuário</label><input class="input" name="users" value="${esc(wiz.users)}" placeholder="Ex.: equipe, clientes"></div><div class="field"><label class="label">Plataformas</label><input class="input" name="platforms" value="${esc(wiz.platforms)}" placeholder="Web, Android, iOS"></div><div class="field wide"><label class="label">Funcionalidades desejadas (uma por linha)</label><textarea name="features">${esc(wiz.features)}</textarea></div><div class="field"><label class="label">Integrações</label><textarea name="integrations">${esc(wiz.integrations)}</textarea></div><div class="field"><label class="label">Segurança, desempenho, acessibilidade etc.</label><textarea name="requirements">${esc(wiz.requirements)}</textarea></div><div class="field wide"><label class="label">Restrições e observações</label><textarea name="constraints">${esc(wiz.constraints)}</textarea></div></div><details><summary style="cursor:pointer;font-size:12px;font-weight:700">Colar briefing existente</summary><textarea id="pasteBrief" placeholder="Cole o texto para usar como referência" style="margin-top:8px"></textarea><button class="btn small" type="button" data-action="use-brief" style="margin-top:7px">Adicionar às observações</button></details>`}
function scopeForm(){if(!wiz.scope.included.length)wiz.scope.included=(wiz.features||'').split(/[\n;]+/).map(x=>x.trim()).filter(Boolean);return `<div class="note">Revise e edite o escopo proposto. Só inclua itens confirmados com o cliente.</div><div class="note"><b>${esc(wiz.type)}</b> · ${esc(wiz.problem)}</div><div class="field"><label class="label">Módulos e funcionalidades incluídos</label><div class="list" id="included">${wiz.scope.included.map((x,i)=>`<div class="line"><input class="input inc" data-i="${i}" value="${esc(x)}"><button class="btn danger small" data-action="remove-inc" data-i="${i}">×</button></div>`).join('')}</div><div style="display:flex;gap:6px;margin-top:7px"><input id="newInc" class="input" placeholder="Nova entrega"><button class="btn small" data-action="add-inc">Adicionar</button></div></div><div class="formgrid">${['excluded','assumptions','risks','dependencies'].map((k,i)=>{let labels=['Fora do escopo','Premissas','Riscos identificados','Dependências do cliente'],arr=wiz.scope[k];return `<div class="field"><label class="label">${labels[i]}</label><div class="list">${arr.map((x,n)=>`<div class="line"><input class="input extra" data-key="${k}" data-i="${n}" value="${esc(x)}"><button class="btn danger small" data-action="remove-extra" data-key="${k}" data-i="${n}">×</button></div>`).join('')}</div><div style="display:flex;gap:6px;margin-top:7px"><input class="input" id="new-${k}" placeholder="Adicionar item"><button class="btn small" data-action="add-extra" data-key="${k}">＋</button></div></div>`}).join('')}</div>`}
function tasksEnsure(){if(!wiz.tasks.length){let model=db.models[wiz.type]||db.models['Sistema web'];wiz.tasks=model.map(name=>({name,complexity:'Média',hours:0}))}}function compute(name){let f={Básico:.7,Intermediário:1,Completo:1.35}[name]||1,hours=wiz.tasks.reduce((a,t)=>a+(Number(t.hours)||0),0)*f,rate=Number(wiz.rate)||0,cost=Number(wiz.cost)||0,cont=Number(wiz.contingency)||0,margin=Number(wiz.margin)||0,base=hours*rate,ca=base*cont/100,ma=(base+cost+ca)*margin/100,discount=Number(wiz.discount)||0;return {hours,rate,cost,cont,ca,margin,ma,discount,total:Math.max(0,base+cost+ca+ma-discount),weeks:Number(wiz.weeks)||Math.max(1,Math.ceil(hours/30))}}function estimate(){tasksEnsure();return `<div class="note">Informe as horas de cada etapa. O sistema calcula cenários comparativos; a estimativa deve ser revisada com base no escopo.</div><div class="formgrid">${[['Taxa por hora (R$)','rate'],['Custos adicionais (R$)','cost'],['Margem (%)','margin'],['Contingência (%)','contingency']].map(([l,n])=>`<div class="field"><label class="label">${l}</label><input class="input" type="number" min="0" step="0.01" name="${n}" value="${wiz[n]}"></div>`).join('')}</div><h3 style="font-size:14px">Esforço por etapa</h3><div class="task" style="font-size:10px;color:#718096;font-weight:700"><span>ETAPA</span><span>COMPLEXIDADE</span><span>HORAS</span><span></span></div><div>${wiz.tasks.map((t,i)=>`<div class="task"><input class="input tname" data-i="${i}" value="${esc(t.name)}"><select class="tcomplex" data-i="${i}">${['Baixa','Média','Alta'].map(x=>`<option ${t.complexity===x?'selected':''}>${x}</option>`).join('')}</select><input class="input thours" data-i="${i}" type="number" min="0" step="0.5" value="${t.hours}"><button class="btn small danger" data-action="remove-task" data-i="${i}">×</button></div>`).join('')}</div><button class="btn small" data-action="add-task">＋ Adicionar etapa</button><h3 style="font-size:14px;margin-top:20px">Cenários</h3><div class="scenarios">${['Básico','Intermediário','Completo'].map(n=>{let c=compute(n);return `<div class="scenario ${wiz.chosen===n?'active':''}"><h3>${n}</h3><p class="tiny muted">${n==='Básico'?'Escopo essencial':n==='Completo'?'Escopo ampliado':'Escopo de referência'}</p><div class="price">${brl(c.total)}</div><div class="tiny muted">${c.hours} h · ${c.weeks} semanas estimadas</div><button class="btn small ${wiz.chosen===n?'primary':''}" data-action="choose" data-name="${n}" style="width:100%;margin-top:9px">${wiz.chosen===n?'Selecionado':'Selecionar'}</button></div>`}).join('')}</div><div class="formula"><span>${compute(wiz.chosen).hours} h × ${brl(wiz.rate)} + custos + contingência + margem − desconto</span><strong>${brl(compute(wiz.chosen).total)}</strong></div>`}
function review(){let c=compute(wiz.chosen),issues=[];if(!wiz.scope.included.length)issues.push('Escopo sem funcionalidades incluídas.');if(!wiz.tasks.some(t=>Number(t.hours)>0))issues.push('Horas ainda não foram estimadas.');return `<div class="note ${issues.length?'warn':''}">${issues.length?'<b>Pontos pendentes:</b><br>'+issues.map(esc).join('<br>'):'Revise o resumo e confirme antes de gerar a proposta.'}</div><div class="formgrid"><div><label class="label">Projeto</label>${esc(wiz.name)}</div><div><label class="label">Cliente</label>${esc(client(wiz.clientId))}</div><div class="wide"><label class="label">Objetivo</label>${esc(wiz.problem)}</div></div><h3 style="font-size:14px;margin:17px 0 7px">Escopo incluído</h3><ul>${wiz.scope.included.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>A definir</li>'}</ul><div class="formgrid"><div><label class="label">Fora do escopo</label><ul>${wiz.scope.excluded.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Não informado</li>'}</ul></div><div><label class="label">Premissas, riscos e dependências</label><ul>${[...wiz.scope.assumptions,...wiz.scope.risks.map(x=>'Risco: '+x),...wiz.scope.dependencies.map(x=>'Dependência: '+x)].map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Não informado</li>'}</ul></div></div><h3 style="font-size:14px">Resumo da estimativa</h3><div class="tablewrap"><table class="table"><thead><tr><th>Etapa</th><th>Complexidade</th><th>Horas</th></tr></thead><tbody>${wiz.tasks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.complexity)}</td><td>${Number(t.hours)||0}</td></tr>`).join('')}</tbody></table></div><div class="formgrid" style="margin-top:13px"><div class="field"><label class="label">Prazo estimado (semanas)</label><input class="input" name="weeks" type="number" min="1" value="${wiz.weeks||c.weeks}"></div><div class="field"><label class="label">Validade (dias)</label><input class="input" name="validity" type="number" min="1" value="${wiz.validity}"></div><div class="field wide"><label class="label">Condição de pagamento</label><input class="input" name="payment" value="${esc(wiz.payment)}"></div><div class="field"><label class="label">Desconto (R$)</label><input class="input" name="discount" type="number" min="0" step=".01" value="${wiz.discount}"></div></div><div class="formula"><span>${c.hours} h · Cenário ${esc(wiz.chosen)} · prazo ${wiz.weeks||c.weeks} semanas</span><strong>${brl(compute(wiz.chosen).total)}</strong></div><label class="check"><input id="confirm" type="checkbox" ${wiz.reviewed?'checked':''}><span>Revisei escopo, horas, custos, premissas, riscos e prazo. Confirmo que os valores e prazos são estimativas e farei a validação final antes do envio.</span></label>`}
function collect(){document.querySelectorAll('.modal [name]').forEach(x=>{wiz[x.name]=x.type==='number'?Number(x.value):x.value});if(step===1){wiz.scope.included=[...document.querySelectorAll('.inc')].map(x=>x.value.trim()).filter(Boolean);document.querySelectorAll('.extra').forEach(x=>wiz.scope[x.dataset.key][Number(x.dataset.i)]=x.value.trim())}if(step===2){wiz.tasks.forEach((t,i)=>{let n=document.querySelector(`.tname[data-i="${i}"]`),h=document.querySelector(`.thours[data-i="${i}"]`),c=document.querySelector(`.tcomplex[data-i="${i}"]`);if(n)t.name=n.value;if(h)t.hours=Number(h.value);if(c)t.complexity=c.value})}if(step===3){wiz.weeks=Number(document.querySelector('[name=weeks]')?.value)||1;wiz.validity=Number(document.querySelector('[name=validity]')?.value)||15;wiz.payment=document.querySelector('[name=payment]')?.value||'';wiz.discount=Number(document.querySelector('[name=discount]')?.value)||0}}
function bindWizard(){document.querySelectorAll('[data-action=close]').forEach(b=>b.onclick=()=>{collect();if(wiz.name)put('Rascunho');close()});document.querySelector('[data-action=back]').onclick=()=>{collect();if(step>0){step--;wizard()}};document.querySelector('[data-action=draft]').onclick=()=>{collect();put('Rascunho');close();render();toast('Rascunho salvo.')};document.querySelector('[data-action=next]').onclick=()=>{collect();if(step===0&&(!wiz.clientId||!wiz.name||!wiz.problem)){toast('Preencha cliente, nome e objetivo.',true);return}if(step<3){step++;wizard()}else{if(!document.getElementById('confirm').checked){toast('Confirme a revisão profissional.',true);return}wiz.reviewed=true;put('Em revisão');close();render();toast('Orçamento revisado e salvo.')}};document.querySelector('[data-action=use-brief]')?.addEventListener('click',()=>{let s=document.getElementById('pasteBrief').value;wiz.constraints+=(wiz.constraints?'\n':'')+s;wizard()});document.querySelector('[data-action=add-inc]')?.addEventListener('click',()=>{collect();let v=document.getElementById('newInc').value.trim();if(v)wiz.scope.included.push(v);wizard()});document.querySelectorAll('[data-action=remove-inc]').forEach(b=>b.onclick=()=>{collect();wiz.scope.included.splice(+b.dataset.i,1);wizard()});document.querySelectorAll('[data-action=add-extra]').forEach(b=>b.onclick=()=>{collect();let k=b.dataset.key,v=document.getElementById('new-'+k).value.trim();if(v)wiz.scope[k].push(v);wizard()});document.querySelectorAll('[data-action=remove-extra]').forEach(b=>b.onclick=()=>{collect();wiz.scope[b.dataset.key].splice(+b.dataset.i,1);wizard()});document.querySelector('[data-action=add-task]')?.addEventListener('click',()=>{collect();wiz.tasks.push({name:'Nova etapa',hours:0,complexity:'Média'});wizard()});document.querySelectorAll('[data-action=remove-task]').forEach(b=>b.onclick=()=>{collect();wiz.tasks.splice(+b.dataset.i,1);wizard()});document.querySelectorAll('[data-action=choose]').forEach(b=>b.onclick=()=>{collect();wiz.chosen=b.dataset.name;wizard()})}
function put(status){wiz.status=status;wiz.updated=new Date().toISOString();wiz.scenarios={};['Básico','Intermediário','Completo'].forEach(n=>wiz.scenarios[n]=compute(n));let i=db.projects.findIndex(p=>p.id===wiz.id);if(i<0)db.projects.unshift(structuredClone(wiz));else db.projects[i]=structuredClone(wiz);save();log(`${i<0?'Orçamento criado':'Orçamento atualizado'}: ${wiz.name}`)}
function proposal(p){let c=db.clients.find(x=>x.id===p.clientId)||{},s=p.scenarios?.[p.chosen]||compute(p.chosen),prof=db.profile;modal(`<div class="mhead noprint"><div><h2>Prévia da proposta</h2><p>${esc(p.name)} · estimativa sujeita a revisão</p></div><button class="btn small" data-action="close">×</button></div><div class="mbody"><article class="doc"><div class="dochead"><b style="font-size:20px;color:#102a43">${esc(prof.brand||prof.name)}</b><div class="tiny muted">${esc(prof.email)} ${prof.phone?' · '+esc(prof.phone):''}</div><h1>Proposta de desenvolvimento de software</h1><b>Projeto:</b> ${esc(p.name)}</div><p><b>Cliente:</b> ${esc(c.company||c.name||'—')}<br><b>Contato:</b> ${esc(c.contact||'—')}<br><b>Data:</b> ${dt(new Date())}</p><h2>1. Objetivo</h2><p>${esc(p.problem)}</p><h2>2. Escopo e entregas</h2><ul>${p.scope.included.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>A confirmar</li>'}</ul>${p.scope.excluded.length?`<p><b>Fora do escopo:</b> ${p.scope.excluded.map(esc).join('; ')}.</p>`:''}<h2>3. Esforço estimado</h2><table><thead><tr><th>Etapa</th><th>Complexidade</th><th>Horas</th></tr></thead><tbody>${p.tasks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.complexity)}</td><td>${Number(t.hours)||0}</td></tr>`).join('')}</tbody></table><p><b>Total estimado:</b> ${s.hours} horas · cenário ${esc(p.chosen)}.</p><h2>4. Investimento estimado</h2><p><b style="font-size:18px">${brl(s.total)}</b></p><p>Memória: ${s.hours} h × ${brl(s.rate)} + custos ${brl(s.cost)} + contingência ${s.cont}% (${brl(s.ca)}) + margem ${s.margin}% (${brl(s.ma)}) − desconto ${brl(s.discount)}.</p><h2>5. Cronograma de referência</h2><p>${p.weeks||s.weeks} semanas estimadas, sujeitas às dependências, validação técnica e disponibilidade das partes.</p><h2>6. Premissas, riscos e dependências</h2><ul>${[...p.scope.assumptions,...p.scope.risks.map(x=>'Risco: '+x),...p.scope.dependencies.map(x=>'Dependência do cliente: '+x)].map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Itens a confirmar.</li>'}</ul><h2>7. Condições comerciais</h2><p>${esc(p.payment)}<br>Validade: ${p.validity} dias.</p><h2>8. Aceite</h2><p>Alterações de escopo podem exigir nova estimativa e revisão das condições.</p><p style="margin-top:28px">__________________________________<br>${esc(c.contact||c.name||'Cliente')}</p><p>__________________________________<br>${esc(prof.name||prof.brand)}</p><div class="hint">Este documento apresenta uma estimativa. Valores e prazos não constituem garantia e devem ser revisados antes da contratação.</div></article></div><div class="mfoot noprint"><button class="btn" data-action="close">Fechar</button><div style="display:flex;gap:7px"><select id="propstatus" style="width:auto">${['Rascunho','Em revisão','Pronta para envio','Enviada','Em negociação','Aprovada','Recusada','Expirada'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" data-action="setstatus" data-id="${p.id}">Atualizar</button><button class="btn" data-action="share">Copiar link do cliente</button><button class="btn primary" data-action="print">Imprimir / PDF</button></div></div>`);document.querySelector('[data-action=print]').onclick=()=>window.print();document.querySelector('[data-action=share]').onclick=()=>shareProposal(p);document.querySelector('[data-action=setstatus]').onclick=()=>{p.status=document.getElementById('propstatus').value;p.updated=new Date().toISOString();save();log(`Status alterado: ${p.name} — ${p.status}`);close();render();toast('Status atualizado.')};document.querySelectorAll('[data-action=close]').forEach(b=>b.onclick=close)}
function sharePayload(p){let c=db.clients.find(x=>x.id===p.clientId)||{},s=p.scenarios?.[p.chosen]||compute(p.chosen);return {name:p.name,type:p.type,client:c.company||c.name||'',proponent:db.profile.brand||db.profile.name||'',problem:p.problem,scope:p.scope,tasks:p.tasks,chosen:p.chosen,estimate:s,weeks:p.weeks||s.weeks,validity:p.validity,payment:p.payment,issuedAt:new Date().toISOString()}}
function shareProposal(p){if(!confirm('O link permite que qualquer pessoa que o receba visualize esta proposta (escopo, horas, valores e condições). Ele não permite editar o orçamento. Deseja gerar e copiar o link?'))return;try{let payload=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(sharePayload(p)))))).replace(/%3D/gi,'');let link=location.href.split('#')[0]+'#orca='+payload;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(()=>toast('Link do cliente copiado.')).catch(()=>window.prompt('Copie o link para enviar ao cliente:',link));else window.prompt('Copie o link para enviar ao cliente:',link)}catch(e){toast('Não foi possível gerar o link.',true)}}

function sharedPage(d){let e=d.estimate||{},scope=d.scope||{},tasks=d.tasks||[];return `<div class="head"><div><h1>Proposta de desenvolvimento de software</h1><p>Visualização compartilhada · leitura somente</p></div><button class="btn primary" id="sharePrint">Imprimir / salvar em PDF</button></div><article class="doc"><div class="dochead"><b style="font-size:20px;color:#102a43">${esc(d.proponent||'Proponente')}</b><h1>${esc(d.name||'Proposta de software')}</h1><div class="tiny muted">${esc(d.type||'Projeto')} · enviada em ${dt(d.issuedAt)}</div></div><p><b>Cliente:</b> ${esc(d.client||'—')}</p><h2>1. Objetivo</h2><p>${esc(d.problem||'—')}</p><h2>2. Escopo e entregas</h2><ul>${(scope.included||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>A confirmar.</li>'}</ul>${scope.excluded?.length?`<p><b>Fora do escopo:</b> ${scope.excluded.map(esc).join('; ')}.</p>`:''}<h2>3. Esforço estimado · cenário ${esc(d.chosen||'Intermediário')}</h2><table><thead><tr><th>Etapa</th><th>Complexidade</th><th>Horas</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.complexity)}</td><td>${Number(t.hours)||0}</td></tr>`).join('')}</tbody></table><p><b>Total estimado:</b> ${Number(e.hours)||0} horas.</p><h2>4. Investimento estimado</h2><p><b style="font-size:20px">${brl(e.total)}</b></p><p>Memória de cálculo: ${Number(e.hours)||0} h × ${brl(e.rate)} + custos ${brl(e.cost)} + contingência ${Number(e.cont)||0}% + margem ${Number(e.margin)||0}% − desconto ${brl(e.discount)}.</p><h2>5. Prazo estimado</h2><p>${Number(d.weeks)||Number(e.weeks)||'A definir'} semanas, sujeito a validação técnica, premissas, dependências e disponibilidade das partes.</p><h2>6. Premissas, riscos e dependências</h2><ul>${[...(scope.assumptions||[]),...(scope.risks||[]).map(x=>'Risco: '+x),...(scope.dependencies||[]).map(x=>'Dependência do cliente: '+x)].map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Itens a confirmar.</li>'}</ul><h2>7. Condições comerciais</h2><p>${esc(d.payment||'A combinar')}<br>Validade: ${Number(d.validity)||15} dias.</p><div class="hint">Este link apresenta uma cópia para visualização. Valores e prazos são estimativas e devem ser confirmados antes da contratação. O link não permite editar o orçamento.</div></article>`}
function bind(){
 const search=document.getElementById('search');
 if(search)search.oninput=()=>{query=search.value;render();const again=document.getElementById('search');again.focus();again.setSelectionRange(query.length,query.length)};
 document.querySelectorAll('.status').forEach(el=>el.onchange=()=>{const p=db.projects.find(x=>x.id===el.dataset.id);if(p){p.status=el.value;save();log(`Status alterado: ${p.name} — ${p.status}`);toast('Status atualizado.')}});
 document.querySelectorAll('[data-action]').forEach(b=>{
  const a=b.dataset.action, pid=b.dataset.id;

 });

}
function saveSettings(){document.querySelectorAll('[name]').forEach(x=>{db.profile[x.name]=x.type==='number'?Number(x.value):x.value});save();toast('Configurações salvas.');render()}function modelForm(name=''){let stages=db.models[name]||[];modal(`<div class="mhead"><div><h2>${name?'Editar':'Novo'} modelo</h2></div><button class="btn small" data-action="close">×</button></div><form id="mf"><div class="mbody"><div class="field"><label class="label">Nome</label><input class="input" name="name" required value="${esc(name)}"></div><div class="field"><label class="label">Etapas, uma por linha</label><textarea name="stages">${esc(stages.join('\n'))}</textarea></div></div><div class="mfoot"><button type="button" class="btn" data-action="close">Cancelar</button><button class="btn primary">Salvar</button></div></form>`);document.querySelectorAll('[data-action=close]').forEach(b=>b.onclick=close);document.getElementById('mf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n=f.get('name');db.models[n]=f.get('stages').split('\n').map(x=>x.trim()).filter(Boolean);save();close();render()}}
function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.clients)||!Array.isArray(x.projects))throw Error();db={...fresh(),...x};save();render();toast('Backup importado.')}catch{toast('Arquivo JSON inválido.',true)}};r.readAsText(f)}
let sbcfg=()=>JSON.parse(localStorage.getItem(SET)||'{}');function saveSB(){let x=sbcfg();x.url=document.querySelector('[name=sburl]').value.trim().replace(/\/$/,'');x.key=document.querySelector('[name=sbkey]').value.trim();if(!x.url||!x.key){toast('Preencha URL e chave anon.',true);return}localStorage.setItem(SET,JSON.stringify(x));toast('Conexão configurada.')}async function sbAuth(){try{let x=sbcfg();if(!x.url||!x.key)throw Error('Configure URL e chave anon primeiro.');let email=prompt('E-mail da conta Supabase');if(!email)return;let pass=prompt('Senha');if(!pass)return;let signup=confirm('Criar conta nova? OK cria conta; Cancelar faz login.');let r=await fetch(x.url+(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:x.key,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})}),j=await r.json();if(!r.ok)throw Error(j.msg||j.message||j.error_description||'Falha ao autenticar');x={...x,token:j.access_token||j.session?.access_token,refresh:j.refresh_token||j.session?.refresh_token,userId:j.user?.id||j.id,email};if(!x.token)throw Error('Confirme o e-mail e entre novamente.');localStorage.setItem(SET,JSON.stringify(x));await sync();render();toast('Conta conectada e dados sincronizados.')}catch(e){toast(e.message,true)}}async function cloudPush(){let x=sbcfg();if(!x.token)throw Error('Entre em uma conta Supabase primeiro.');let r=await fetch(x.url+'/rest/v1/orca_user_data?on_conflict=user_id',{method:'POST',headers:{apikey:x.key,Authorization:'Bearer '+x.token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:x.userId,data:db,updated_at:new Date().toISOString()})});if(!r.ok)throw Error('Falha ao gravar dados; confira tabela e RLS.')}async function sync(){let x=sbcfg();if(!x.token)throw Error('Entre em uma conta Supabase primeiro.');let h={apikey:x.key,Authorization:'Bearer '+x.token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},url=x.url+'/rest/v1/orca_user_data';let get=await fetch(url+'?user_id=eq.'+encodeURIComponent(x.userId)+'&select=data',{headers:h});if(!get.ok)throw Error('Falha ao acessar tabela; confira SQL e RLS.');let rows=await get.json();if(rows.length){db={...fresh(),...rows[0].data};save()}else{let ins=await fetch(url,{method:'POST',headers:h,body:JSON.stringify({user_id:x.userId,data:db,updated_at:new Date().toISOString()})});if(!ins.ok)throw Error('Falha ao criar dados no banco.');}return true}
document.addEventListener('submit',e=>{});render();})();
</script></body></html>
